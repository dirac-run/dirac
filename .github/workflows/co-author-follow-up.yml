name: Co-author follow-up

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: co-author-follow-up-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # The token can comment on fork PRs. Only run code from the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { followUp } = require('./.github/scripts/co-author-follow-up.cjs')
            await followUp(github, context.repo, context.payload.pull_request)
