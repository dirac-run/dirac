syntax = "proto3";

package dirac;

import "dirac/common.proto";
import "dirac/state.proto";

option go_package = "github.com/dirac/grpc-go/dirac";
option java_multiple_files = true;
option java_package = "bot.dirac.proto";

service TaskService {
  // Cancels the currently running task
  rpc cancelTask(EmptyRequest) returns (Empty);
  // Cancels the currently running background command
  rpc cancelBackgroundCommand(EmptyRequest) returns (Empty);
  // Clears the current task
  rpc clearTask(EmptyRequest) returns (Empty);
  // Gets the total size of all tasks
  rpc getTotalTasksSize(EmptyRequest) returns (Int64);
  // Deletes multiple tasks with the given IDs
  rpc deleteTasksWithIds(StringArrayRequest) returns (Empty);
  // Creates a new task with the given text and optional images
  rpc newTask(NewTaskRequest) returns (String);
  // Shows a task with the specified ID
  rpc showTaskWithId(StringRequest) returns (TaskResponse);
  // Exports a task with the given ID to markdown
  rpc exportTaskWithId(StringRequest) returns (Empty);
  // Toggles the favorite status of a task
  rpc toggleTaskFavorite(TaskFavoriteRequest) returns (Empty);
  // Gets filtered task history
  rpc getTaskHistory(GetTaskHistoryRequest) returns (TaskHistoryArray);
  // Passive, selected-root observation. JSON payloads use shared/taskletObservation.ts.
  rpc getTaskletInventory(TaskletInventoryRequest) returns (String);
  rpc getTaskletTranscript(TaskletTranscriptRequest) returns (String);
  // Sends a response to a previous ask operation
  rpc askResponse(AskResponseRequest) returns (Empty);
  // Queues task-level guidance for the next uncommitted model turn
  rpc steerTask(SteerTaskRequest) returns (Empty);
  // Records task feedback (thumbs up/down)
  rpc taskFeedback(StringRequest) returns (Empty);
  // Shows task completion changes diff in a view
  rpc taskCompletionViewChanges(StringRequest) returns (Empty);
  // Executes a quick win task with command and title
  rpc executeQuickWin(ExecuteQuickWinRequest) returns (Empty);
  // Deletes all task history
  rpc deleteAllTaskHistory(EmptyRequest) returns (DeleteAllTaskHistoryCount);
}

// Read-only requests never construct a Task, supervise a child, or acknowledge events.
// A source mismatch or incompatible cursor fails explicitly; refresh without a cursor.
message TaskletInventoryRequest {
  Metadata metadata = 1;
  string root_task_id = 2;
  optional string source_id = 3;
  string filter = 4;
  optional string cursor = 5;
  optional int32 limit = 6;
}

message TaskletTranscriptRequest {
  Metadata metadata = 1;
  string root_task_id = 2;
  optional string source_id = 3;
  string tasklet_id = 4;
  optional string cursor = 5;
  optional int32 limit = 6;
}

// Request message for creating a new task
message NewTaskRequest {
  Metadata metadata = 1;
  string text = 2;
  repeated string images = 3;
  repeated string files = 4;
  optional Settings task_settings = 5;
}

// Request message for toggling task favorite status
message TaskFavoriteRequest {
  Metadata metadata = 1;
  string task_id = 2;
  bool is_favorited = 3;
}

// Response for task details
message TaskResponse {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  // Legacy Task accounting. Goal clients must use accounting instead.
  optional double total_cost = 6;
  optional int32 tokens_in = 7;
  optional int32 tokens_out = 8;
  optional int32 cache_writes = 9;
  optional int32 cache_reads = 10;
  string model_id = 11;
  optional string run_kind = 12;
  GoalAccountingItem accounting = 13;
}

// Request for getting task history with filtering
message GetTaskHistoryRequest {
  Metadata metadata = 1;
  bool favorites_only = 2;
  string search_query = 3;
  string sort_by = 4;
  bool current_workspace_only = 5;
}

// Response for task history
message TaskHistoryArray {
  repeated TaskItem tasks = 1;
  int32 total_count = 2;
}

// Task item details for history list
message TaskItem {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  // Legacy Task accounting. Goal clients must use accounting instead.
  optional double total_cost = 6;
  optional int32 tokens_in = 7;
  optional int32 tokens_out = 8;
  optional int32 cache_writes = 9;
  optional int32 cache_reads = 10;
  string model_id = 11;
  optional string run_kind = 12;
  optional string conversation_ulid = 13;
  optional string initial_display_text = 14;
  optional string objective_preview = 15;
  optional int32 objective_revision = 16;
  optional string status = 17;
  optional string status_reason = 18;
  optional int64 created_at = 19;
  optional int64 updated_at = 20;
  optional int64 active_duration_ms = 21;
  GoalAccountingItem accounting = 22;
}

message GoalAccountingItem {
  optional double total_tokens = 1;
  optional double input_tokens = 2;
  optional double output_tokens = 3;
  optional double reasoning_tokens = 4;
  optional double cache_read_tokens = 5;
  optional double cache_write_tokens = 6;
  optional double cost = 7;
}

// Request for ask response operation
message AskResponseRequest {
  Metadata metadata = 1;
  string response_type = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
  map<string, string> user_edits = 6;
  string card_id = 7;
  string value = 8;
}

// Request for task-level mid-turn guidance
message SteerTaskRequest {
  Metadata metadata = 1;
  string text = 2;
}

// Request for executing a quick win task
message ExecuteQuickWinRequest {
  Metadata metadata = 1;
  string command = 2;
  string title = 3;
}

// Results returned when deleting all task history
message DeleteAllTaskHistoryCount {
  int32 tasks_deleted = 1;
}
